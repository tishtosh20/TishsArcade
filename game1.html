<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 1 - Tish's Arcade</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Berkshire+Swash&display=swap" rel="stylesheet">
</head>
<body>

    <!-- FLOATING DOTS -->
    <div class="floating-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- WRAPPER -->
    <div class="container">

        <!-- SIDE IMAGES -->
        <img src="images/stars-left.png" class="stars left" alt="">
        <img src="images/stars-right.png" class="stars right" alt="">

        <!-- BACK BUTTON -->
        <a href="home-game.html" class="back-btn">← BACK TO ARCADE</a>

        <!-- GAME TITLE -->
        <div class="title-row">
            <img src="images/octo.png" class="octo-icon left" alt="">
            <h1 class="game-title">OCTO-MATH</h1>
            <img src="images/octo.png" class="octo-icon right" alt="">
        </div>

        <!-- GAME AREA - IFRAME EMBED -->
        <div class="game-container">
            <iframe 
                src="https://editor.p5js.org/Tish20/full/Gr9JkDGOL" 
                class="game-iframe"
                allowfullscreen>
            </iframe>
        </div>

        <!-- INSTRUCTIONS -->
        <div class="instructions">
            <h2>HOW TO PLAY</h2>
            <p>✦ Use arrow keys to move</p>
            <p>✦ Collect bubbles to reach target</p>
            <p>✦ Press S to shoot in boss phase</p>
        </div>

    </div>

</body>
</html>
